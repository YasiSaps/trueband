[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "trueband"
dynamic = ["version"]
description = "Find audio files whose real frequency content doesn't match their format: low-bitrate rips re-encoded at 320 kbps, lossy files passed off as FLAC."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Yasi Saps" }]
keywords = ["audio", "spectrum", "transcode", "fake-flac", "bitrate", "dj", "music-library", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]

[project.scripts]
trueband = "trueband.cli:main"

[project.urls]
Homepage = "https://github.com/YasiSaps/trueband"
Issues = "https://github.com/YasiSaps/trueband/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.version]
path = "src/trueband/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
markers = ["ffmpeg: needs ffmpeg/ffprobe on PATH (skipped otherwise)"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["prototype"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "BLE", "E722", "D"]
ignore = ["D105", "D107", "D401", "PTH123"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["trueband"]
